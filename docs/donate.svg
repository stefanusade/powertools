<svg xmlns="http://www.w3.org/2000/svg" width="300" height="64" viewBox="0 0 300 64" role="img" aria-label="Dukung PowerTools lewat Sociabuzz">
  <title>Dukung PowerTools lewat Sociabuzz</title>
  <!--
    Sumber tombol donasi. `docs/donate.png` (600x128, untuk layar 2x) dibuat
    dari berkas ini; kalau teks atau warnanya diubah, render ulang:

      python3 - <<'PY'
      import gi
      gi.require_version("GdkPixbuf", "2.0")
      from gi.repository import GdkPixbuf
      pb = GdkPixbuf.Pixbuf.new_from_file_at_scale("docs/donate.svg", 600, 128, True)
      pb.savev("docs/donate.png", "png", [], [])
      PY

    PNG dipakai di README, bukan SVG: GitHub menampilkan SVG sebagai gambar
    mentah tanpa penskalaan, jadi badge-nya jadi terlalu besar di halaman.
  -->
  <defs>
    <linearGradient id="pill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff8a4c"/>
      <stop offset="0.55" stop-color="#f8557a"/>
      <stop offset="1" stop-color="#dd3b8c"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="298" height="62" rx="31" fill="url(#pill)"/>
  <rect x="1.75" y="1.75" width="296.5" height="60.5" rx="30.25"
        fill="none" stroke="#ffffff" stroke-opacity="0.38" stroke-width="1.5"/>
  <path d="M34 44c0 0-13-8.5-13-16.5 0-4.7 3.6-8 7.6-8 2.6 0 4.6 1.3 5.4 3.1 0.8-1.8 2.8-3.1 5.4-3.1 4 0 7.6 3.3 7.6 8C47 35.5 34 44 34 44Z"
        fill="#ffffff" fill-opacity="0.95"/>
  <text x="64" y="28.5" font-family="DejaVu Sans, Liberation Sans, Segoe UI, Arial, Helvetica, sans-serif"
        font-size="18" font-weight="700" fill="#ffffff">Dukung PowerTools</text>
  <text x="64" y="46" font-family="DejaVu Sans, Liberation Sans, Segoe UI, Arial, Helvetica, sans-serif"
        font-size="11" fill="#ffffff" fill-opacity="0.86">donasi sukarela · Sociabuzz</text>
</svg>
